# Thresholds and rubric weights (SPEC §6.1, §6.2).

dedup:
  embedding_cosine_threshold: 0.88   # items at or above this similarity are treated as duplicates

scout:
  default_limit: 25
  per_query_limit: 15         # items kept from each feed/query before dedup
  max_items_to_score: 80      # cap on deduplicated items sent to the scorer per run
  max_age_days: 30            # news items older than this are dropped
  embed_batch_size: 50
  rubric_weights:
    drama: 1.0
    twist: 1.0
    relatability: 1.0
    visual_potential: 0.8
    hook_number: 0.8
    freshness: 1.0

# Cheap rules applied to news items before any LLM scoring (case-insensitive).
prefilter:
  min_title_words: 4
  # Headlines matching any of these regexes are dropped (advice threads, listicles, promos…).
  drop_title_patterns:
    - "^(how (do|can|should) i|should i|anyone (else|know)|what('s| is) your|ama\\b|ask hn)"
    - "^(daily|weekly|monthly) (discussion|thread)"
    - "\\b(horoscope|recipe|giveaway|coupon|promo code|deal of the day|webinar|sponsored)\\b"
    - "\\b(nfl|nba|mlb|nhl|premier league|box office|red carpet)\\b"
  # Feeds whose items must mention at least one business keyword to be scored.
  require_business_keyword_for: ["Hacker News", "r/"]
  business_keywords:
    - company
    - startup
    - ceo
    - founder
    - bankrupt
    - chapter 11
    - fraud
    - lawsuit
    - sued
    - indicted
    - sec
    - layoffs
    - acquired
    - acquisition
    - shut down
    - shuts down
    - collapse
    - billion
    - million
    - valuation
    - ipo
    - scandal
    - brand
    - retailer
    - restructuring
    - debt
    - revenue

gap_finder:
  youtube_view_threshold: 100000     # a video above this many views counts as existing coverage
  search_results_per_check: 10       # videos looked at per search.list call
  coverage_saturation: 5             # this many popular videos = fully covered (low_coverage 0)
  search_calls_reserve: 10           # leave this many of the 100/day search calls unused
  units_reserve: 500                 # leave this many of the 10,000/day units unused
  # article_richness normalisation (value at which each part counts as "full")
  richness_refs_full: 100
  richness_length_full: 80000        # bytes of wikitext
  richness_pageviews_full: 100000    # pageviews over pageview_days
  weights:
    story_quality: 0.5
    article_richness: 0.2
    low_coverage: 0.3

outlier:
  default_threshold: 3.0
  default_videos_per_channel: 50
  # Shorts rule (support.google.com/youtube/answer/15424877, verified 2026-10-05): a square or
  # vertical video up to 3 minutes is a Short if uploaded on/after 2024-10-15; before that the
  # limit was 60 s. Aspect ratio comes from videos.list player.embedWidth/embedHeight.
  shorts_max_duration_s: 180
  shorts_long_limit_from: "2024-10-15"
  shorts_max_duration_before_s: 60
  min_age_days: 3                    # newer videos are still gaining views: not flagged or in medians
  min_videos_for_median: 5           # per channel and format
  analyze_max: 25                    # flagged videos sent to analysis per run (not already analysed)
  analyze_batch: 8

series:
  - Childhood Brands
  - Tech Graveyard
  - Fraud Files
  - Everyday Genius
  - Comebacks
  - Recent Collapses
